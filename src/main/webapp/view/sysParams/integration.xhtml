<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">
    <h:form id="integrationPanel" style="height: 100%; overflow: auto;">
        <p:panel id="rootPanel" styleClass="tc-panel" header="Интеграция">
            <div style="margin-bottom: 5px;">
                <p:panel styleClass="tc-panel blue-header" header="АСОТ">
                    <div style="height: calc(100% - 6px); padding: 3px;">
                        <p:dataTable id="asot" value="#{integrationMB.asot}" var="asot"
                                     scrollable="true" scrollHeight="300"
                                     emptyMessage="#{global['table.empty.value']}">
                            <p:column headerText="Справочник" width="250" styleClass="center">
                                <h:outputText value="#{asot.tableName}"/>
                            </p:column>
                            <p:column headerText="MUID" width="200" styleClass="center">
                                <h:outputText value="#{asot.muid}"/>
                            </p:column>
                            <p:column headerText="Дата" width="200" styleClass="center">
                                <h:outputText value="#{asot.createDate}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Операция" width="50" styleClass="center">
                                <h:outputText value="#{asot.operation}"/>
                            </p:column>
                            <p:column headerText="Статус">
                                <h:outputText value="#{asot.status}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </p:panel>
            </div>
            <div style="margin-bottom: 5px;">
                <p:panel styleClass="tc-panel blue-header" header="ЕСМ">
                    <div style="height: calc(100% - 6px); width: calc(100% - 6px); padding: 3px;">
                        <p:dataTable id="esm" value="#{integrationMB.esm}" var="esm"
                                     scrollable="true" scrollHeight="300" scrollWidth="100%"
                                     emptyMessage="#{global['table.empty.value']}">
                            <p:columnGroup type="header">
                                <p:row>
                                    <p:column headerText="login" style="min-width: 120px;"/>
                                    <p:column headerText="ip" style="min-width: 120px;"/>
                                    <p:column headerText="Дата" style="min-width: 180px;"/>
                                    <p:column headerText="Действие" style="min-width: 300px;"/>
                                    <p:column headerText="Имя объекта" style="min-width: 150px;"/>
                                    <p:column headerText="Имя свойства объекта" style="min-width: 250px;"/>
                                    <p:column headerText="Имя файла" style="min-width: 200px;"/>
                                    <p:column headerText="GUID" style="min-width: 350px;"/>
                                </p:row>
                            </p:columnGroup>

                            <p:column styleClass="center">
                                <h:outputText value="#{esm.login}"/>
                            </p:column>
                            <p:column styleClass="center">
                                <h:outputText value="#{esm.ip}"/>
                            </p:column>
                            <p:column styleClass="center">
                                <h:outputText value="#{esm.date}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{esm.action}"/>
                            </p:column>
                            <p:column styleClass="center">
                                <h:outputText value="#{esm.objName}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{esm.propName}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{esm.fileName}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{esm.esmGuid}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </p:panel>
            </div>
            <div style="margin-bottom: 5px;">
                <p:panel styleClass="tc-panel blue-header" header="ЕОД">
                    <div style="height: calc(100% - 6px); padding: 3px;">
                        <p:dataTable id="eod" value="#{integrationMB.eod}" var="eod"
                                     scrollable="true" scrollHeight="300"
                                     emptyMessage="#{global['table.empty.value']}">
                            <p:column headerText="Дата" width="100" styleClass="center">
                                <h:outputText value="#{eod.date}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Имя пользователя" width="100" styleClass="center">
                                <h:outputText value="#{eod.userName}"/>
                            </p:column>
                            <p:column headerText="Имя вызываемой процедуры" width="200" styleClass="center">
                                <h:outputText value="#{eod.viewName}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </p:panel>
            </div>
            <div>
                <p:panel styleClass="tc-panel blue-header" header="АССД">
                    <div style="height: calc(100% - 6px); padding: 3px;">
                        <p:dataTable id="assd" value="#{integrationMB.assd}" var="assd"
                                     scrollable="true" scrollHeight="300"
                                     emptyMessage="#{global['table.empty.value']}">
                            <p:column headerText="Объект" width="100" styleClass="center">
                                <h:outputText value="#{assd.objId}"/>
                            </p:column>
                            <p:column headerText="Параметр" width="100" styleClass="center">
                                <h:outputText value="#{assd.parId}"/>
                            </p:column>
                            <p:column headerText="Значение" styleClass="center">
                                <h:outputText value="#{assd.value}"/>
                            </p:column>
                            <p:column headerText="Дата измерения" width="200" styleClass="center">
                                <h:outputText value="#{assd.date}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Дата прихода данных" width="200" styleClass="center">
                                <h:outputText value="#{assd.updated}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </p:column>
                        </p:dataTable>
                    </div>
                </p:panel>
            </div>
        </p:panel>
    </h:form>
</ui:composition>
